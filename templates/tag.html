{% extends 'base.html' %}

{% block title %}Tag: #{{ tag }} — Analis Siber Purwakarta{% endblock %}

{% block content %}
<h1 class="page-title">Tag: <span class="accent-text">#{{ tag }}</span></h1>

<section class="post-list">
  {% for post in posts %}
  <article class="post-card">
    <h2 class="post-title"><a href="/posts/{{ post.slug }}">{{ post.title }}</a></h2>
    <div class="post-meta">{{ post.date }}</div>
    <p class="post-summary">{{ post.summary }}</p>
  </article>
  {% else %}
  <p class="post-summary">Tidak ada artikel dengan tag ini.</p>
  {% endfor %}
</section>
{% endblock %}
